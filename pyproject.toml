[project]
name = "wintermute"
version = "0.2.0"
description = "Autonomous Freeside OS Developer AI Platform powered by Google Antigravity SDK"
requires-python = ">=3.15"
dependencies = [
    "google-antigravity>=0.1.0",
    "blacksheep>=2.0.0",
    "jinja2>=3.1.4",
    "aiosqlite>=0.20.0",
    "sqlite-vec>=0.1.6",
    "httpx>=0.28.0",
    "click>=8.1.7",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4.6,<1.0.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[project.scripts]
wintermute = "app.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "UP", "RUF"]
ignore = ["E501", "C901", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
